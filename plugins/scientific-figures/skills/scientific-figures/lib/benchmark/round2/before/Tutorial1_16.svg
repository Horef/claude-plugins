<svg xmlns="http://www.w3.org/2000/svg" width="820" height="175" viewBox="0 0 820 175" font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="820" height="175" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="10" y="40" width="140" height="80" fill="#dbe7f7" stroke="#1f5fbf" stroke-width="2" rx="8"/><text x="80" y="70" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">x(0)</text><text x="80" y="92" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">initial state</text><text x="80" y="108" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">standard basis</text><rect x="175" y="40" width="140" height="80" fill="#fff4e0" stroke="#d9822b" stroke-width="2" rx="8"/><text x="245" y="70" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">multiply by U⁻¹</text><text x="245" y="92" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">rows = left</text><text x="245" y="108" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">eigenvectors</text><rect x="340" y="40" width="140" height="80" fill="#eef7ee" stroke="#2e8b57" stroke-width="2" rx="8"/><text x="410" y="70" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">x̃ₖ(t) = x̃ₖ(0) e^(μₖt)</text><text x="410" y="92" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">each mode evolves</text><text x="410" y="108" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">on its own</text><rect x="505" y="40" width="140" height="80" fill="#fff4e0" stroke="#d9822b" stroke-width="2" rx="8"/><text x="575" y="70" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">multiply by U</text><text x="575" y="92" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">columns = right</text><text x="575" y="108" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">eigenvectors</text><rect x="670" y="40" width="140" height="80" fill="#dbe7f7" stroke="#1f5fbf" stroke-width="2" rx="8"/><text x="740" y="70" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">x(t)</text><text x="740" y="92" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">state at time t</text><text x="740" y="108" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal">standard basis</text><line x1="152" y1="80" x2="173" y2="80" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/><line x1="317" y1="80" x2="338" y2="80" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/><line x1="482" y1="80" x2="503" y2="80" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/><line x1="647" y1="80" x2="668" y2="80" stroke="#222222" stroke-width="1.5" marker-end="url(#arr)"/><text x="410" y="155" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal">diagonalisation: M = U D U⁻¹, so e^(Mt) = U e^(Dt) U⁻¹</text><text x="410" y="22" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">Solving x' = Mx by changing to the eigenbasis and back</text></svg>